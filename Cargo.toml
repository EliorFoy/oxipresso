[workspace]
members = [
  "crates/oxipresso-cli",
  "crates/oxipresso-editor-protocol",
  "crates/oxipresso-engine-api",
  "crates/oxipresso-engine-external",
  "crates/oxipresso-engine-xetex",
  "crates/oxipresso-engine-xetex-sys",
  "crates/oxipresso-platform",
  "crates/oxipresso-render",
  "crates/oxipresso-synctex",
  "crates/oxipresso-testkit",
  "crates/oxipresso-vfs",
  "crates/oxipresso-viewer",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/oxipresso/oxipresso"

[workspace.dependencies]
base64 = "0.22"
cc = "1.2"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
