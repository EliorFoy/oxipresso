[package]
name = "oxipresso-viewer"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
gui = ["dep:eframe"]
pdfium = ["oxipresso-render/pdfium"]
pdfium-bundled = ["pdfium", "oxipresso-render/pdfium-bundled"]

[dependencies]
eframe = { version = "0.34.3", optional = true, default-features = false, features = ["default_fonts", "wgpu"] }
oxipresso-engine-api = { path = "../oxipresso-engine-api" }
oxipresso-platform = { path = "../oxipresso-platform" }
oxipresso-render = { path = "../oxipresso-render" }
