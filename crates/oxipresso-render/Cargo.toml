[package]
name = "oxipresso-render"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
pdfium = ["dep:pdfium-auto", "dep:pdfium-render"]
pdfium-bundled = ["pdfium", "pdfium-auto/bundled"]

[dependencies]
oxipresso-engine-api = { path = "../oxipresso-engine-api" }
pdfium-auto = { version = "0.3.0", optional = true }
pdfium-render = { version = "0.8.37", optional = true }
