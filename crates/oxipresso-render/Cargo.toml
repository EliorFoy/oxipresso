[package]
name = "oxipresso-render"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
pdfium = ["dep:pdfium-auto", "dep:pdfium-render"]
pdfium-bundled = ["pdfium", "pdfium-auto/bundled"]
# Real glyph rasterization for XDV/DVI artifacts through the FreeType C
# library (discovered through vcpkg on Windows / pkg-config on Linux).
freetype = ["dep:vcpkg", "dep:pkg-config"]

[dependencies]
oxipresso-engine-api = { path = "../oxipresso-engine-api" }
pdfium-auto = { version = "0.3.0", optional = true }
pdfium-render = { version = "0.8.37", optional = true }

[build-dependencies]
pkg-config = { version = "0.3", optional = true }
vcpkg = { version = "0.2", optional = true }
